<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BridgeSign — Hearing Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink: #1A1B26; --sage: #6B7A5E; --sage-lt: #8A9A74;
      --burg: #6B1E2E; --cream: #F4F2EB; --rose: #B08A80;
      --white: #FFFFFF; --muted: #7A7A7A; --border: rgba(107,122,94,0.15);
      --radius: 16px; --sb: 260px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--cream); color: var(--ink); display: flex; height: 100vh; overflow: hidden; }

    /* SIDEBAR */
    .sidebar { width: var(--sb); background: var(--ink); display: flex; flex-direction: column; padding: 26px 18px; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; color: var(--white); display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 38px; }
    .logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--burg); display: flex; align-items: center; justify-content: center; }
    .logo-mark svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2; }
    .logo em { color: var(--rose); font-style: normal; }
    .sb-section { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.25); padding: 0 12px; margin: 18px 0 8px; }
    .nav { display: flex; flex-direction: column; gap: 3px; }
    .nav-link { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-radius: 11px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.45); cursor: pointer; transition: all .2s; text-decoration: none; border: none; background: none; width: 100%; font-family: 'Outfit', sans-serif; }
    .nav-link:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
    .nav-link.active { background: var(--burg); color: var(--white); }
    .nav-link svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; flex-shrink: 0; }
    .sidebar-foot { margin-top: auto; }
    .user-pill { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 11px; background: rgba(255,255,255,0.05); }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--burg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2; }
    .u-name { font-size: 13px; font-weight: 600; color: var(--white); }
    .u-role { font-size: 11px; color: rgba(255,255,255,0.35); }

    /* MAIN */
    .main { margin-left: var(--sb); flex: 1; display: flex; height: 100vh; overflow: hidden; }

    /* USERS PANEL */
    .users-panel { width: 300px; flex-shrink: 0; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .users-header { padding: 22px 20px 16px; border-bottom: 1px solid var(--border); }
    .users-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
    .search-box { display: flex; align-items: center; gap: 9px; background: var(--cream); border-radius: 10px; padding: 9px 13px; }
    .search-box svg { width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 2; flex-shrink: 0; }
    .search-box input { border: none; background: none; font-size: 13px; font-family: 'Outfit', sans-serif; color: var(--ink); outline: none; flex: 1; }
    .search-box input::placeholder { color: #bbb; }
    .users-list { flex: 1; overflow-y: auto; }
    .user-item { display: flex; align-items: center; gap: 13px; padding: 14px 18px; cursor: pointer; transition: background .15s; border-bottom: 1px solid rgba(107,122,94,0.07); position: relative; }
    .user-item:hover { background: rgba(107,30,46,0.04); }
    .user-item.active { background: rgba(107,30,46,0.07); }
    .user-item.active::before { content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px; background: var(--burg); border-radius: 0 3px 3px 0; }
    .user-av { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(107,122,94,0.12); font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700; color: var(--sage); }
    .user-meta { flex: 1; min-width: 0; }
    .user-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .user-role-badge { font-size: 11px; color: var(--muted); }
    .no-users { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 60px 20px; opacity: 0.4; text-align: center; }
    .no-users svg { width: 36px; height: 36px; fill: none; stroke: var(--ink); stroke-width: 1.5; }
    .no-users p { font-size: 13px; font-weight: 600; }

    /* CHAT AREA */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--cream); min-width: 0; }
    .chat-header { background: var(--white); padding: 16px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .chat-user-info { display: flex; align-items: center; gap: 13px; }
    .chat-av { width: 42px; height: 42px; border-radius: 50%; background: rgba(107,122,94,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700; color: var(--sage); }
    .chat-name { font-size: 16px; font-weight: 600; }
    .chat-status { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer; background: var(--cream); display: flex; align-items: center; justify-content: center; transition: background .2s; text-decoration: none; }
    .icon-btn:hover { background: rgba(107,122,94,0.15); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 1.8; }

    /* MESSAGES */
    .chat-messages { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
    .select-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .select-state svg { width: 64px; height: 64px; fill: none; stroke: rgba(107,30,46,0.25); stroke-width: 1.2; }
    .select-state h3 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 700; color: rgba(30,32,43,0.4); }
    .select-state p { font-size: 14px; color: var(--muted); text-align: center; max-width: 260px; }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; opacity: 0.45; }
    .empty-state svg { width: 52px; height: 52px; fill: none; stroke: var(--ink); stroke-width: 1.2; }
    .empty-state p { font-size: 15px; font-weight: 600; }

    /* MESSAGE BUBBLES */
    .msg { display: flex; flex-direction: column; max-width: 68%; position: relative; padding-right: 36px; }
    .msg.from-them { padding-right: 0; padding-left: 36px; }
    .msg.from-me { align-self: flex-end; align-items: flex-end; }
    .msg.from-them { align-self: flex-start; align-items: flex-start; }
    .msg-bubble { padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.6; }
    .from-me .msg-bubble { background: var(--burg); color: var(--white); border-bottom-right-radius: 4px; }
    .from-them .msg-bubble { background: var(--white); color: var(--ink); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .sign-received { background: rgba(107,122,94,0.1); border: 1.5px dashed rgba(107,122,94,0.4); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .sign-received svg { width: 32px; height: 32px; fill: none; stroke: var(--sage); stroke-width: 1.5; flex-shrink: 0; }
    .sign-label strong { display: block; font-size: 13px; font-weight: 600; }
    .sign-label span { font-size: 12px; color: var(--muted); }
    .msg-meta { font-size: 11px; color: var(--muted); margin-top: 5px; }

    /* DELETE BUTTON — fixed: stays inside .msg hover zone */
    .delete-btn {
      display: none;
      position: absolute;
      top: 4px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      padding: 5px 6px;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .from-me .delete-btn { right: 0; }
    .from-them .delete-btn { left: 0; }
    .delete-btn svg { width: 13px; height: 13px; fill: none; stroke: #c0392b; stroke-width: 2; display: block; }
    .msg:hover .delete-btn, .delete-btn:hover, .delete-btn:focus { display: block; }

    /* INPUT AREA */
    .chat-input-area { background: var(--white); border-top: 1px solid var(--border); padding: 16px 24px; flex-shrink: 0; }
    .input-mode-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .imt { display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 50px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; border: 1.5px solid var(--border); background: var(--cream); color: var(--muted); font-family: 'Outfit', sans-serif; }
    .imt svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
    .imt:hover { border-color: var(--burg); color: var(--burg); }
    .imt.active { background: var(--burg); border-color: var(--burg); color: var(--white); }
    .input-panel { display: none; }
    .input-panel.visible { display: block; }
    .voice-view { background: var(--ink); border-radius: 12px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
    .voice-inner { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .voice-inner svg { width: 32px; height: 32px; fill: none; stroke: rgba(255,255,255,0.35); stroke-width: 1.5; }
    .voice-inner p { font-size: 12px; color: rgba(255,255,255,0.35); }
    .voice-actions { display: flex; gap: 10px; }
    .btn-voice { flex: 1; padding: 11px; border-radius: 12px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; transition: all .2s; }
    .btn-voice-go { background: var(--burg); color: var(--white); }
    .btn-voice-go:hover { background: #8a2535; }
    .btn-voice-cancel { background: rgba(107,30,46,0.08); color: var(--burg); }
    .text-row { display: flex; gap: 10px; align-items: flex-end; }
    .msg-textarea { flex: 1; padding: 12px 15px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 14px; font-family: 'Outfit', sans-serif; color: var(--ink); background: var(--cream); resize: none; outline: none; transition: border-color .2s; height: 48px; max-height: 120px; }
    .msg-textarea:focus { border-color: var(--burg); }
    .btn-send { width: 48px; height: 48px; border-radius: 12px; border: none; cursor: pointer; background: var(--burg); color: var(--white); display: flex; align-items: center; justify-content: center; transition: background .2s; flex-shrink: 0; }
    .btn-send:hover { background: #8a2535; }
    .btn-send svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(107,122,94,0.25); border-radius: 10px; }

    /* ── MOBILE RESPONSIVE ── */
    .mobile-topbar { display: none; }
    .back-btn { display: none; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { display: none; }
      .main { margin-left: 0; flex-direction: column; height: 100vh; overflow: hidden; }

      .mobile-topbar {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--ink); padding: 13px 16px; flex-shrink: 0;
      }
      .mobile-topbar-logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; color: var(--white); }
      .mobile-topbar-logo em { color: var(--rose); font-style: normal; }
      .mobile-topbar-right { display: flex; align-items: center; gap: 8px; }
      .mobile-topbar-name { font-size: 12px; color: rgba(255,255,255,0.5); }
      .mobile-logout { background: rgba(255,255,255,0.1); border: none; color: white; padding: 5px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; font-family: 'Outfit', sans-serif; }

      .users-panel { width: 100%; flex: 1; border-right: none; overflow: hidden; display: flex; flex-direction: column; }
      .users-header { padding: 14px 16px 10px; }
      .users-list { flex: 1; overflow-y: auto; }

      .chat-area { display: none; position: fixed; inset: 0; z-index: 40; flex-direction: column; background: var(--cream); }
      .chat-area.mobile-open { display: flex; }

      .back-btn {
        display: flex; align-items: center; gap: 5px;
        background: none; border: none; cursor: pointer;
        color: var(--burg); font-size: 13px; font-weight: 600;
        font-family: 'Outfit', sans-serif; margin-right: 8px; flex-shrink: 0;
      }
      .back-btn svg { width: 16px; height: 16px; fill: none; stroke: var(--burg); stroke-width: 2.5; }

      .chat-header { padding: 10px 14px; }
      .chat-messages { padding: 14px 16px; }
      .chat-input-area { padding: 10px 14px; }
      .msg { max-width: 85%; }
      .voice-view { height: 75px; }
      .from-me .delete-btn { right: 0; }
      .from-them .delete-btn { left: 0; }
    }

    @media (max-width: 480px) {
      .msg { max-width: 90%; }
      .input-mode-tabs { gap: 6px; }
      .imt { padding: 7px 10px; font-size: 11px; }
      .chat-input-area { padding: 8px 12px; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR (desktop only) -->
<aside class="sidebar">
  <a href="index.html" class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm7 6c0 3.31-2.69 6-6 6s-6-2.69-6-6H4c0 4.08 2.95 7.44 6.84 7.93L11 20v2h2v-2l.16-.07C17.05 19.44 20 16.08 20 12h-2z"/></svg>
    </div>
    Bridge<em>Sign</em>
  </a>
  <div class="sb-section">Messaging</div>
  <nav class="nav">
    <a class="nav-link active" href="#">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      Messages
    </a>
  </nav>
  <div class="sb-section">Account</div>
  <nav class="nav">
    <a class="nav-link" href="login.html" onclick="logout()">
      <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
      Sign Out
    </a>
  </nav>
  <div class="sidebar-foot">
    <div class="user-pill">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm7 6c0 3.31-2.69 6-6 6s-6-2.69-6-6H4c0 4.08 2.95 7.44 6.84 7.93L11 20v2h2v-2l.16-.07C17.05 19.44 20 16.08 20 12h-2z"/></svg>
      </div>
      <div>
        <div class="u-name" id="user-name">Loading...</div>
        <div class="u-role">Hearing User</div>
      </div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">

  <!-- MOBILE TOPBAR -->
  <div class="mobile-topbar">
    <div class="mobile-topbar-logo">Bridge<em>Sign</em></div>
    <div class="mobile-topbar-right">
      <span class="mobile-topbar-name" id="mobile-user-name"></span>
      <button class="mobile-logout" onclick="logout(); window.location.href='login.html'">Sign Out</button>
    </div>
  </div>

  <!-- USERS LIST -->
  <div class="users-panel">
    <div class="users-header">
      <h2>Conversations</h2>
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search deaf users..." oninput="filterUsers(this.value)"/>
      </div>
    </div>
    <div class="users-list" id="users-list">
      <div class="no-users">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <p>Loading users...</p>
      </div>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chat-area">
    <div class="chat-header">
      <div class="chat-user-info">
        <button class="back-btn" onclick="goBackToList()">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back
        </button>
        <div class="chat-av" id="chat-av">?</div>
        <div>
          <div class="chat-name" id="chat-contact-name">Select a user to start chatting</div>
          <div class="chat-status" id="chat-status"></div>
        </div>
      </div>
      <div>
        <a href="login.html" class="icon-btn" onclick="logout()">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        </a>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="select-state" id="select-state">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <h3>Start a Conversation</h3>
        <p>Select a deaf user from the list to start communicating using voice or text.</p>
      </div>
    </div>

    <div class="chat-input-area" id="chat-input-area" style="display:none">
      <div class="input-mode-tabs">
        <button class="imt active" onclick="setMode('voice', this)">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm7 6c0 3.31-2.69 6-6 6s-6-2.69-6-6H4c0 4.08 2.95 7.44 6.84 7.93L11 20v2h2v-2l.16-.07C17.05 19.44 20 16.08 20 12h-2z"/></svg>
          Voice
        </button>
        <button class="imt" onclick="setMode('text', this)">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          Type
        </button>
      </div>
      <div class="input-panel visible" id="panel-voice">
        <div class="voice-view">
          <div class="voice-inner">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm7 6c0 3.31-2.69 6-6 6s-6-2.69-6-6H4c0 4.08 2.95 7.44 6.84 7.93L11 20v2h2v-2l.16-.07C17.05 19.44 20 16.08 20 12h-2z"/></svg>
            <p id="voice-status">Press Record to start speaking</p>
          </div>
        </div>
        <div class="voice-actions">
          <button class="btn-voice btn-voice-go" id="voice-btn" onclick="toggleVoice()">Record Voice</button>
          <button class="btn-voice btn-voice-cancel" onclick="cancelVoice()">Cancel</button>
        </div>
      </div>
      <div class="input-panel" id="panel-text">
        <div class="text-row">
          <textarea class="msg-textarea" id="text-input" placeholder="Type your message..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="btn-send" onclick="sendTextMsg()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const API = 'https://myproject-production-c78f.up.railway.app';
  const token = localStorage.getItem('bs_token');
  const profile = JSON.parse(localStorage.getItem('bs_profile') || 'null');

  if (!token || !profile || profile.role !== 'hearing') window.location.href = 'login.html';

  document.getElementById('user-name').textContent = profile?.name || 'User';
  const mun = document.getElementById('mobile-user-name');
  if (mun) mun.textContent = profile?.name || '';

  let recognition = null, isRecording = false;
  let currentReceiverId = null, currentReceiverName = null, allUsers = [];

  function logout() { localStorage.clear(); }

  function goBackToList() {
    document.getElementById('chat-area').classList.remove('mobile-open');
  }

  async function loadUsers() {
    try {
      const res = await fetch(`${API}/users?role=deaf`, { headers: { 'Authorization': `Bearer ${token}` } });
      allUsers = await res.json();
      renderUsers(allUsers);
    } catch (e) {
      document.getElementById('users-list').innerHTML = `<div class="no-users"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg><p>Error loading users</p></div>`;
    }
  }

  function renderUsers(users) {
    const list = document.getElementById('users-list');
    if (!users.length) { list.innerHTML = `<div class="no-users"><p>No deaf users found</p></div>`; return; }
    list.innerHTML = users.map(u => `
      <div class="user-item" onclick="selectUser('${u.user_id}', '${u.name} ${u.lastname}', this)">
        <div class="user-av">${u.name.charAt(0).toUpperCase()}</div>
        <div class="user-meta">
          <div class="user-name">${u.name} ${u.lastname}</div>
          <div class="user-role-badge">Deaf User</div>
        </div>
      </div>`).join('');
  }

  function filterUsers(val) {
    renderUsers(allUsers.filter(u => (u.name+' '+u.lastname).toLowerCase().includes(val.toLowerCase())));
  }

  function selectUser(userId, userName, el) {
    currentReceiverId = userId;
    currentReceiverName = userName;
    document.querySelectorAll('.user-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('chat-av').textContent = userName.charAt(0).toUpperCase();
    document.getElementById('chat-contact-name').textContent = userName;
    document.getElementById('chat-status').textContent = 'Deaf User';
    document.getElementById('chat-input-area').style.display = 'block';
    document.getElementById('chat-area').classList.add('mobile-open');
    lastMessageCount = 0;
    cancelVoice();
    loadConversation(userId);
    startPolling();
  }

  async function loadConversation(userId) {
    const container = document.getElementById('chat-messages');
    // Clear chat fully before loading new conversation
    container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);font-size:13px">Loading...</div>';
    try {
      const res = await fetch(`${API}/messages/${userId}`, { headers: { 'Authorization': `Bearer ${token}` } });
      const messages = await res.json();
      container.innerHTML = '';
      if (!Array.isArray(messages) || !messages.length) {
        container.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><p>No history available</p></div>`;
        return;
      }
      messages.forEach(m => appendMsg(m.type, m.content, m.sender_id === profile.user_id, m.media_url, m.date, m.message_id));
      container.scrollTop = container.scrollHeight;
    } catch (e) {
      container.innerHTML = `<div class="empty-state"><p>Failed to load conversation</p></div>`;
      console.error(e);
    }
  }

  function setMode(mode, btn) {
    document.querySelectorAll('.imt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.input-panel').forEach(p => p.classList.remove('visible'));
    document.getElementById('panel-' + mode).classList.add('visible');
    if (mode !== 'voice') cancelVoice();
  }

  async function toggleVoice() {
    const btn = document.getElementById('voice-btn');
    const status = document.getElementById('voice-status');
    if (!isRecording) {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) { alert('Use Chrome for voice recognition.'); return; }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'en-US'; recognition.continuous = false; recognition.interimResults = false;
      recognition.onresult = async (e) => {
        const text = e.results[0][0].transcript;
        cancelVoice();
        try {
          const mapRes = await fetch(`${API}/mappingdata/search?text=${encodeURIComponent(text)}`, { headers: { 'Authorization': `Bearer ${token}` } });
          const mapData = await mapRes.json();
          appendMsg('voice', text, true, mapData.content_url || null);
          await saveMessage(text, 'voice', mapData.content_url || null);
        } catch { appendMsg('voice', text, true); await saveMessage(text, 'voice'); }
      };
      recognition.onerror = () => cancelVoice();
      recognition.start();
      isRecording = true; btn.textContent = 'Stop Recording'; btn.style.background = '#8a2535';
      status.textContent = 'Listening...';
    } else cancelVoice();
  }

  function cancelVoice() {
    if (recognition) { recognition.stop(); recognition = null; }
    isRecording = false;
    const btn = document.getElementById('voice-btn');
    const status = document.getElementById('voice-status');
    if (btn) { btn.textContent = 'Record Voice'; btn.style.background = ''; }
    if (status) status.textContent = 'Press Record to start speaking';
  }

  async function sendTextMsg() {
    const ta = document.getElementById('text-input');
    const text = ta.value.trim();
    if (!text || !currentReceiverId) return;
    ta.value = ''; ta.style.height = '48px';
    try {
      const mapRes = await fetch(`${API}/mappingdata/search?text=${encodeURIComponent(text)}`, { headers: { 'Authorization': `Bearer ${token}` } });
      const mapData = await mapRes.json();
      appendMsg('text', text, true, mapData.content_url || null);
      await saveMessage(text, 'text', mapData.content_url || null);
    } catch { appendMsg('text', text, true); await saveMessage(text, 'text'); }
  }

  async function saveMessage(content, type, mediaUrl = null) {
    if (!currentReceiverId) return;
    try {
      await fetch(`${API}/messages`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ receiver_id: currentReceiverId, content, type, media_url: mediaUrl })
      });
    } catch (e) { console.error(e); }
  }

  async function deleteMessage(messageId, divEl) {
    if (!confirm('Delete this message?')) return;
    try {
      await fetch(`${API}/messages/${messageId}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      divEl.remove();
    } catch (e) { alert('Failed to delete message.'); }
  }

  function appendMsg(type, text, fromMe, mediaUrl = null, timestamp = null, messageId = null) {
    const container = document.getElementById('chat-messages');
    document.getElementById('select-state')?.remove();
    document.querySelector('.empty-state')?.remove();
    const now = timestamp
      ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const div = document.createElement('div');
    div.className = 'msg ' + (fromMe ? 'from-me' : 'from-them');

    const deleteBtn = messageId ? `
      <button class="delete-btn" title="Delete message" onclick="deleteMessage('${messageId}', this.closest('.msg'))">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>` : '';

    if (type === 'sign') {
      div.innerHTML = `<div class="sign-received"><svg viewBox="0 0 24 24"><path d="M21 6.5c0-1.1-.9-2-2-2h-2V3c0-1.1-.9-2-2-2s-2 .9-2 2v1H9V3c0-1.1-.9-2-2-2S5 1.9 5 3v1.5H3c-1.1 0-2 .9-2 2v15c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6.5z"/></svg><div class="sign-label"><strong>Sign Message</strong><span>"${text}"</span></div></div><div class="msg-meta">${currentReceiverName} · ${now}</div>${deleteBtn}`;
    } else if (mediaUrl) {
      const isVideo = mediaUrl.match(/\.(mp4|webm|mov)$/i);
      div.innerHTML = `<div class="msg-bubble" style="padding:8px"><div style="font-size:11px;opacity:0.7;margin-bottom:6px">${type==='voice'?'Voice':'Text'}: "${text}"</div>${isVideo?`<video src="${mediaUrl}" controls style="max-width:180px;border-radius:10px;display:block"></video>`:`<img src="${mediaUrl}" alt="sign" style="max-width:180px;border-radius:10px;display:block">`}</div><div class="msg-meta">You · ${now}</div>${deleteBtn}`;
    } else {
      div.innerHTML = `<div class="msg-bubble">${type==='voice'?`<span style="font-size:11px;opacity:0.7;display:block;margin-bottom:4px">🎙 Voice message</span>`:''}${text}</div><div class="msg-meta">${fromMe?'You':currentReceiverName} · ${now}</div>${deleteBtn}`;
    }
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${API}/messages/history`, { headers: { 'Authorization': `Bearer ${token}` } });
      const messages = await res.json();
      const container = document.getElementById('chat-messages');
      document.getElementById('select-state')?.remove();
      container.innerHTML = '';
      if (!Array.isArray(messages) || !messages.length) {
        container.innerHTML = '<div class="empty-state"><p>No history available.</p></div>';
        return;
      }
      messages.forEach(m => appendMsg(m.type, m.content, m.sender_id === profile.user_id, m.media_url, m.date, m.message_id));
    } catch (e) { console.error(e); }
  }

  function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTextMsg(); } }
  function autoResize(el) { el.style.height = '48px'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

  // ── NOTIFICATIONS + POLLING ──────────────────────────
  let lastMessageCount = 0;
  let pollTimer = null;
  let knownMessageIds = new Set();

  async function requestNotifPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
      await Notification.requestPermission();
    }
  }

  function showNotif(senderName, text) {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(`New message from ${senderName}`, {
        body: text.length > 60 ? text.substring(0, 60) + '...' : text,
        icon: 'https://bridgsign.netlify.app/favicon.ico'
      });
    }
  }

  async function pollMessages() {
    try {
      const res = await fetch(`${API}/messages/history`, { headers: { 'Authorization': `Bearer ${token}` } });
      const messages = await res.json();
      if (!Array.isArray(messages)) return;

      const isFirstLoad = knownMessageIds.size === 0;
      messages.forEach(m => {
        if (!knownMessageIds.has(m.message_id)) {
          knownMessageIds.add(m.message_id);
          if (!isFirstLoad && m.sender_id !== profile.user_id) {
            showNotif('Deaf User', m.content);
          }
        }
      });

      if (currentReceiverId) {
        const convRes = await fetch(`${API}/messages/${currentReceiverId}`, { headers: { 'Authorization': `Bearer ${token}` } });
        const convMsgs = await convRes.json();
        if (!Array.isArray(convMsgs)) return;
        if (convMsgs.length > lastMessageCount) {
          const container = document.getElementById('chat-messages');
          const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;
          container.innerHTML = '';
          convMsgs.forEach(m => appendMsg(m.type, m.content, m.sender_id === profile.user_id, m.media_url, m.date, m.message_id));
          if (atBottom) container.scrollTop = container.scrollHeight;
          lastMessageCount = convMsgs.length;
        }
      }
    } catch (e) {}
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(pollMessages, 4000);
  }

  loadUsers();
  requestNotifPermission();
  startPolling();
</script>
