<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BridgeSign — Deaf Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink: #1A1B26; --sage: #6B7A5E; --sage-lt: #8A9A74;
      --burg: #6B1E2E; --cream: #F4F2EB; --rose: #B08A80;
      --white: #FFFFFF; --muted: #7A7A7A; --border: rgba(107,122,94,0.15);
      --radius: 16px; --sb: 260px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--cream); color: var(--ink); display: flex; height: 100vh; overflow: hidden; }

    /* SIDEBAR */
    .sidebar { width: var(--sb); background: var(--ink); display: flex; flex-direction: column; padding: 26px 18px; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; }
    .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; color: var(--white); display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 38px; }
    .logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--sage); display: flex; align-items: center; justify-content: center; }
    .logo-mark svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2; }
    .logo em { color: var(--rose); font-style: normal; }
    .sb-section { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.25); padding: 0 12px; margin: 18px 0 8px; }
    .nav { display: flex; flex-direction: column; gap: 3px; }
    .nav-link { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-radius: 11px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.45); cursor: pointer; transition: all .2s; text-decoration: none; border: none; background: none; width: 100%; font-family: 'Outfit', sans-serif; }
    .nav-link:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
    .nav-link.active { background: var(--sage); color: var(--white); }
    .nav-link svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; flex-shrink: 0; }
    .sidebar-foot { margin-top: auto; }
    .user-pill { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 11px; background: rgba(255,255,255,0.05); }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--sage); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .avatar svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2; }
    .u-name { font-size: 13px; font-weight: 600; color: var(--white); }
    .u-role { font-size: 11px; color: rgba(255,255,255,0.35); }

    /* MAIN */
    .main { margin-left: var(--sb); flex: 1; display: flex; height: 100vh; overflow: hidden; }

    /* USERS LIST */
    .users-panel { width: 300px; flex-shrink: 0; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .users-header { padding: 22px 20px 16px; border-bottom: 1px solid var(--border); }
    .users-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
    .search-box { display: flex; align-items: center; gap: 9px; background: var(--cream); border-radius: 10px; padding: 9px 13px; }
    .search-box svg { width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 2; flex-shrink: 0; }
    .search-box input { border: none; background: none; font-size: 13px; font-family: 'Outfit', sans-serif; color: var(--ink); outline: none; flex: 1; }
    .search-box input::placeholder { color: #bbb; }
    .users-list { flex: 1; overflow-y: auto; }
    .user-item { display: flex; align-items: center; gap: 13px; padding: 14px 18px; cursor: pointer; transition: background .15s; border-bottom: 1px solid rgba(107,122,94,0.07); position: relative; }
    .user-item:hover { background: rgba(107,122,94,0.05); }
    .user-item.active { background: rgba(107,122,94,0.1); }
    .user-item.active::before { content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 3px; background: var(--sage); border-radius: 0 3px 3px 0; }
    .user-av { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: rgba(107,30,46,0.1); font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700; color: var(--burg); }
    .user-meta { flex: 1; min-width: 0; }
    .user-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .user-role-badge { font-size: 11px; color: var(--muted); }
    .no-users { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 60px 20px; opacity: 0.4; text-align: center; }
    .no-users svg { width: 36px; height: 36px; fill: none; stroke: var(--ink); stroke-width: 1.5; }
    .no-users p { font-size: 13px; font-weight: 600; }

    /* CHAT AREA */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--cream); min-width: 0; }
    .chat-header { background: var(--white); padding: 16px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .chat-user-info { display: flex; align-items: center; gap: 13px; }
    .chat-av { width: 42px; height: 42px; border-radius: 50%; background: rgba(107,30,46,0.1); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 700; color: var(--burg); }
    .chat-name { font-size: 16px; font-weight: 600; }
    .chat-status { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer; background: var(--cream); display: flex; align-items: center; justify-content: center; transition: background .2s; text-decoration: none; }
    .icon-btn:hover { background: rgba(107,122,94,0.15); }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 1.8; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; opacity: 0.45; }
    .empty-state svg { width: 52px; height: 52px; fill: none; stroke: var(--ink); stroke-width: 1.2; }
    .empty-state p { font-size: 15px; font-weight: 600; }
    .empty-state span { font-size: 13px; color: var(--muted); text-align: center; max-width: 240px; }

    /* SELECT USER STATE */
    .select-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .select-state svg { width: 64px; height: 64px; fill: none; stroke: rgba(107,122,94,0.3); stroke-width: 1.2; }
    .select-state h3 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 700; color: rgba(30,32,43,0.4); }
    .select-state p { font-size: 14px; color: var(--muted); text-align: center; max-width: 260px; }

    .msg { display: flex; flex-direction: column; max-width: 68%; }
    .msg.from-me { align-self: flex-end; align-items: flex-end; }
    .msg.from-them { align-self: flex-start; align-items: flex-start; }
    .msg-bubble { padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.6; }
    .from-me .msg-bubble { background: var(--ink); color: var(--white); border-bottom-right-radius: 4px; }
    .from-them .msg-bubble { background: var(--white); color: var(--ink); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .msg-sign-bubble { background: rgba(107,122,94,0.1); border: 1.5px dashed rgba(107,122,94,0.4); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .msg-sign-bubble svg { width: 32px; height: 32px; fill: none; stroke: var(--sage); stroke-width: 1.5; flex-shrink: 0; }
    .sign-label strong { display: block; font-weight: 600; font-size: 13px; }
    .sign-label span { color: var(--muted); font-size: 12px; }
    .msg-video { max-width: 200px; border-radius: 12px; overflow: hidden; }
    .msg-video video { width: 100%; border-radius: 12px; }
    .msg-video img { width: 100%; border-radius: 12px; }
    .msg-meta { font-size: 11px; color: var(--muted); margin-top: 5px; display: flex; align-items: center; gap: 5px; }

    /* INPUT BAR */
    .chat-input-area { background: var(--white); border-top: 1px solid var(--border); padding: 16px 24px; flex-shrink: 0; }
    .input-mode-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .imt { display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 50px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .2s; border: 1.5px solid var(--border); background: var(--cream); color: var(--muted); font-family: 'Outfit', sans-serif; }
    .imt svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
    .imt:hover { border-color: var(--sage); color: var(--sage); }
    .imt.active { background: var(--sage); border-color: var(--sage); color: var(--white); }
    .input-panel { display: none; }
    .input-panel.visible { display: block; }

    .cam-view { background: var(--ink); border-radius: 12px; height: 140px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; position: relative; overflow: hidden; }
    .cam-view video { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: none; }
    .cam-placeholder { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .cam-placeholder svg { width: 36px; height: 36px; fill: none; stroke: rgba(255,255,255,0.35); stroke-width: 1.5; }
    .cam-placeholder p { font-size: 12px; color: rgba(255,255,255,0.35); }
    .rec-badge { position: absolute; top: 10px; right: 10px; background: var(--burg); color: var(--white); font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 50px; display: none; align-items: center; gap: 5px; }
    .rec-dot { width: 6px; height: 6px; background: var(--white); border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }
    .cam-actions { display: flex; gap: 10px; }
    .btn-cam { flex: 1; padding: 11px; border-radius: 12px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; transition: all .2s; }
    .btn-cam-go { background: var(--sage); color: var(--white); }
    .btn-cam-go:hover { background: var(--sage-lt); }
    .btn-cam-cancel { background: rgba(107,30,46,0.08); color: var(--burg); }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(107,122,94,0.25); border-radius: 10px; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <a href="index.html" class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
    </div>
    Bridge<em>Sign</em>
  </a>
  <div class="sb-section">Messaging</div>
  <nav class="nav">
    <a class="nav-link active" href="#">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      Messages
    </a>
  </nav>
  <div class="sb-section">Account</div>
  <nav class="nav">
    <a class="nav-link" href="login.html" onclick="logout()">
      <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
      Sign Out
    </a>
  </nav>
  <div class="sidebar-foot">
    <div class="user-pill">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M17 8C17 10.76 15.35 13.15 13 14.29V17H11V14.29C8.65 13.15 7 10.76 7 8C7 4.69 9.69 2 13 2C16.31 2 17 4.69 17 8Z"/></svg>
      </div>
      <div>
        <div class="u-name" id="user-name">Loading...</div>
        <div class="u-role">Deaf User</div>
      </div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">

  <!-- USERS LIST -->
  <div class="users-panel">
    <div class="users-header">
      <h2>Conversations</h2>
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search users..." oninput="filterUsers(this.value)" id="search-input"/>
      </div>
    </div>
    <div class="users-list" id="users-list">
      <div class="no-users">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <p>Loading users...</p>
      </div>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-user-info">
        <div class="chat-av" id="chat-av">?</div>
        <div>
          <div class="chat-name" id="chat-contact-name">Select a user to start chatting</div>
          <div class="chat-status" id="chat-status"></div>
        </div>
      </div>
      <div>
        <a href="login.html" class="icon-btn" onclick="logout()">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        </a>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="select-state" id="select-state">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <h3>Start a Conversation</h3>
        <p>Select a hearing user from the list to start communicating using sign language.</p>
      </div>
    </div>

    <!-- INPUT BAR -->
    <div class="chat-input-area" id="chat-input-area" style="display:none">
      <div class="input-mode-tabs">
        <button class="imt active" onclick="setMode('sign', this)">
          <svg viewBox="0 0 24 24"><path d="M21 6.5c0-1.1-.9-2-2-2h-2V3c0-1.1-.9-2-2-2s-2 .9-2 2v1H9V3c0-1.1-.9-2-2-2S5 1.9 5 3v1.5H3c-1.1 0-2 .9-2 2v15c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6.5z"/></svg>
          Sign (Camera)
        </button>
      </div>

      <div class="input-panel visible" id="panel-sign">
        <div class="cam-view" id="cam-view">
          <video id="cam-feed" autoplay playsinline muted></video>
          <div class="cam-placeholder" id="cam-ph">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            <p>Camera off — press Start to capture your sign</p>
          </div>
          <div class="rec-badge" id="rec-badge"><div class="rec-dot"></div> REC</div>
        </div>
        <div class="cam-actions">
          <button class="btn-cam btn-cam-go" id="cam-btn" onclick="toggleCamera()">Start Camera</button>
          <button class="btn-cam btn-cam-cancel" onclick="cancelCamera()">Cancel</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const API = 'https://myproject-production-c78f.up.railway.app';
  const token = localStorage.getItem('bs_token');
  const profile = JSON.parse(localStorage.getItem('bs_profile') || 'null');

  if (!token || !profile || profile.role !== 'deaf') {
    window.location.href = 'login.html';
  }

  document.getElementById('user-name').textContent = profile?.name || 'User';

  let stream = null, capturing = false;
  let currentReceiverId = null;
  let currentReceiverName = null;
  let allUsers = [];

  function logout() { localStorage.clear(); }

  // ── LOAD HEARING USERS ─────────────────────────────────
  async function loadUsers() {
    try {
      const res = await fetch(`${API}/users?role=hearing`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      allUsers = await res.json();
      renderUsers(allUsers);
    } catch (e) {
      document.getElementById('users-list').innerHTML = `
        <div class="no-users">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <p>Error loading users</p>
        </div>`;
    }
  }

  function renderUsers(users) {
    const list = document.getElementById('users-list');
    if (!users.length) {
      list.innerHTML = `
        <div class="no-users">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <p>No hearing users found</p>
        </div>`;
      return;
    }
    list.innerHTML = users.map(u => `
      <div class="user-item" onclick="selectUser('${u.user_id}', '${u.name} ${u.lastname}', this)">
        <div class="user-av">${u.name.charAt(0).toUpperCase()}</div>
        <div class="user-meta">
          <div class="user-name">${u.name} ${u.lastname}</div>
          <div class="user-role-badge">Hearing User</div>
        </div>
      </div>
    `).join('');
  }

  function filterUsers(val) {
    const filtered = allUsers.filter(u =>
      (u.name + ' ' + u.lastname).toLowerCase().includes(val.toLowerCase())
    );
    renderUsers(filtered);
  }

  function selectUser(userId, userName, el) {
    currentReceiverId = userId;
    currentReceiverName = userName;

    // Update active state
    document.querySelectorAll('.user-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');

    // Update chat header
    document.getElementById('chat-av').textContent = userName.charAt(0).toUpperCase();
    document.getElementById('chat-contact-name').textContent = userName;
    document.getElementById('chat-status').textContent = 'Hearing User';

    // Show input bar
    document.getElementById('chat-input-area').style.display = 'block';
    document.getElementById('chat-area').classList.add('mobile-open');

    // Load conversation + start polling
    lastMessageCount = 0;
    loadConversation(userId);
    startPolling();
  }

  async function loadConversation(userId) {
    try {
      const res = await fetch(`${API}/messages/${userId}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const messages = await res.json();
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';

      if (!Array.isArray(messages) || !messages.length) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            <p>No messages yet</p>
            <span>Start the conversation by signing or typing a message.</span>
          </div>`;
        return;
      }

      messages.forEach(m => {
        const fromMe = m.sender_id === profile.user_id;
        appendMsg(m.type, m.content, fromMe, m.media_url);
      });
    } catch (e) { console.error('Error loading conversation:', e); }
  }

  function setMode(mode, btn) {
    document.querySelectorAll('.imt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.input-panel').forEach(p => p.classList.remove('visible'));
    document.getElementById('panel-' + mode).classList.add('visible');
    if (mode !== 'sign') cancelCamera();
  }

  async function toggleCamera() {
    const btn = document.getElementById('cam-btn');
    const ph = document.getElementById('cam-ph');
    const video = document.getElementById('cam-feed');
    const rec = document.getElementById('rec-badge');
    if (!capturing) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.style.display = 'block';
        ph.style.display = 'none';
        rec.style.display = 'flex';
        btn.textContent = 'Stop & Send Sign';
        capturing = true;
      } catch (e) { alert('Camera access denied.'); }
    } else {
      stopCamera();
      sendSignMsg();
    }
  }

  function stopCamera() {
    const video = document.getElementById('cam-feed');
    const ph = document.getElementById('cam-ph');
    const rec = document.getElementById('rec-badge');
    const btn = document.getElementById('cam-btn');
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.style.display = 'none';
    ph.style.display = 'flex';
    rec.style.display = 'none';
    btn.textContent = 'Start Camera';
    capturing = false;
  }

  function cancelCamera() { stopCamera(); }

  async function sendSignMsg() {
    const text = "Sign gesture captured";
    appendMsg('sign', text, true);
    await saveMessage(text, 'sign');
  }


  async function saveMessage(content, type, mediaUrl = null) {
    if (!currentReceiverId) return;
    try {
      await fetch(`${API}/messages`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          receiver_id: currentReceiverId,
          content,
          type,
          media_url: mediaUrl
        })
      });
    } catch (e) { console.error('Error saving message:', e); }
  }

  function appendMsg(type, text, fromMe, mediaUrl = null) {
    const container = document.getElementById('chat-messages');
    const selectState = document.getElementById('select-state');
    if (selectState) selectState.remove();
    const emptyState = document.querySelector('.empty-state');
    if (emptyState) emptyState.remove();

    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const div = document.createElement('div');
    div.className = 'msg ' + (fromMe ? 'from-me' : 'from-them');

    if (type === 'sign') {
      div.innerHTML = `
        <div class="msg-sign-bubble">
          <svg viewBox="0 0 24 24"><path d="M21 6.5c0-1.1-.9-2-2-2h-2V3c0-1.1-.9-2-2-2s-2 .9-2 2v1H9V3c0-1.1-.9-2-2-2S5 1.9 5 3v1.5H3c-1.1 0-2 .9-2 2v15c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6.5z"/></svg>
          <div class="sign-label"><strong>Sign Message</strong><span>"${text}"</span></div>
        </div>
        <div class="msg-meta">You · ${now}</div>`;
    } else if (mediaUrl) {
      const isVideo = mediaUrl.match(/\.(mp4|webm|mov)$/i);
      div.innerHTML = `
        <div class="msg-video">
          ${isVideo
            ? `<video src="${mediaUrl}" controls autoplay loop style="max-width:200px;border-radius:12px"></video>`
            : `<img src="${mediaUrl}" alt="sign" style="max-width:200px;border-radius:12px">`
          }
        </div>
        <div class="msg-meta">${fromMe ? 'You' : currentReceiverName} · ${now}</div>`;
    } else {
      div.innerHTML = `
        <div class="msg-bubble">${text}</div>
        <div class="msg-meta">${fromMe ? 'You' : currentReceiverName} · ${now}</div>`;
    }
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${API}/messages/history`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const messages = await res.json();
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      if (!Array.isArray(messages) || !messages.length) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">No history available.</div>';
        return;
      }
      messages.forEach(m => {
        const fromMe = m.sender_id === profile.user_id;
        appendMsg(m.type, m.content, fromMe, m.media_url);
      });
    } catch (e) { console.error('Error loading history:', e); }
  }



  // ── NOTIFICATIONS + POLLING ──────────────────────────
  let lastMessageCount = 0;
  let pollTimer = null;
  let knownMessageIds = new Set();

  async function requestNotifPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
      await Notification.requestPermission();
    }
  }

  function showNotif(senderName, text) {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(`New message from ${senderName}`, {
        body: text.length > 60 ? text.substring(0, 60) + '...' : text,
        icon: 'https://mellow-malabi-861e60.netlify.app/favicon.ico'
      });
    }
  }

  async function pollMessages() {
    try {
      // Global poll — check all messages received
      const res = await fetch(`${API}/messages/history`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const messages = await res.json();
      if (!Array.isArray(messages)) return;

      // Find new messages received by me
      messages.forEach(m => {
        if (m.sender_id !== profile.user_id && !knownMessageIds.has(m.message_id)) {
          knownMessageIds.add(m.message_id);
          // Only notify if it's a truly new message (not on first load)
          if (knownMessageIds.size > 1 || messages.length === 1) {
            showNotif('Hearing User', m.content);
          }
        } else {
          knownMessageIds.add(m.message_id);
        }
      });

      // If conversation open, refresh it silently
      if (currentReceiverId) {
        const convRes = await fetch(`${API}/messages/${currentReceiverId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const convMsgs = await convRes.json();
        if (!Array.isArray(convMsgs)) return;
        if (convMsgs.length > lastMessageCount) {
          const container = document.getElementById('chat-messages');
          const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;
          container.innerHTML = '';
          convMsgs.forEach(m => appendMsg(m.type, m.content, m.sender_id === profile.user_id, m.media_url));
          if (atBottom) container.scrollTop = container.scrollHeight;
          lastMessageCount = convMsgs.length;
        }
      }
    } catch (e) {}
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(pollMessages, 4000);
  }

  // Load users on start
  loadUsers();
  requestNotifPermission();
  startPolling(); // Start polling immediately — not waiting for conversation selection
</script>
</body>
